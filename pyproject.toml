[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chronopipe"
version = "0.1.0"
description = "Host tools for ChronoPipe evidence streams"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "ChronoPipe contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Hardware",
]
dependencies = []

[project.scripts]
chronopipe = "chronopipe.cli:main"

[tool.setuptools]
package-dir = {"" = "host/python"}

[tool.setuptools.packages.find]
where = ["host/python"]
